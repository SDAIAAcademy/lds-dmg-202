<h2>اليوم 1: من المصدر إلى الكتالوج</h2>
<ol>
<li><p>بعد أول استخلاص لقاعدة الاختبارات، ظهر في مدخل جدول الجلسات عدد من الحقول. أي حقل يبقى فارغًا حتى يكتبه إنسان؟</p><ul><li><b>أ.</b> عدد الصفوف وآخر استخلاص</li><li><b>ب.</b> أنواع الأعمدة الخمسة في جدول الجلسات</li><li><b>ج.</b> تصنيف جدول الجلسات ومالكه</li><li><b>د.</b> أدنى عدد مقاعد وأعلاه بين الجلسات</li></ul></li>
<li><p>مسودة لعمود exam_results.passed: «1 إذا تجاوز المرشح 70 درجة، ويبقى الاجتياز صالحًا سنتين.» المصدر: الاجتياز 1 حين تبلغ الدرجة 60، ولا مدة صلاحية في أي وثيقة.</p><ul><li><b>أ.</b> قبول، لأن الصياغة واضحة والمعنى العام صحيح</li><li><b>ب.</b> تعديل الحد إلى 60 فقط، وإبقاء مدة الصلاحية</li><li><b>ج.</b> رفض، والنوع وحدة أو صيغة خاطئة</li><li><b>د.</b> رفض، والنوع قاعدة مختلقة لا مصدر لها</li></ul></li>
<li><p>قرر مدير الاختبارات أن «المرشح الناجح» من نجح في آخر محاولة. قسم التقارير ما زال يحتاج عدد من نجح في أي محاولة. ما الذي يُسجّل في القاموس؟</p><ul><li><b>أ.</b> التعريف المعتمد فقط، ويُطلب من التقارير ترك رقمها</li><li><b>ب.</b> التعريف المعتمد، واسم آخر للرقم الثاني، والقرار وتاريخه</li><li><b>ج.</b> التعريفان معًا تحت المصطلح نفسه، ويختار القارئ ما يناسبه</li><li><b>د.</b> لا شيء في القاموس، ويُضاف عمود جديد للرقم الآخر في جدول النتائج</li></ul></li>
<li><p>في قاعدة بيانات الاختبارات جدول اسمه tmp_results_load ينشئه التحميل كل ليلة ثم لا يحذفه. ظهر في نتائج البحث في الكتالوج بجانب جدول النتائج الحقيقي. أين يُعالج ذلك؟</p><ul><li><b>أ.</b> في وصفة الاستخلاص، بنمط استبعاد لأسماء الجداول المؤقتة</li><li><b>ب.</b> في وصف الجدول في الكتالوج، بعبارة «جدول مؤقت لا تستعمله»</li><li><b>ج.</b> في قاعدة البيانات، بأن يحذف المشرف الفني الجدول يدويًا كل صباح</li><li><b>د.</b> في صلاحيات الكتالوج، بإخفاء الجدول عن غير المشرفين</li></ul></li>
<li><p>ينتهي التحميل الليلي لقاعدة الاعتماد قرابة الثانية صباحًا بتوقيت الرياض. كتب فني الجدولة «0 1 * * *» دون منطقة زمنية، والأداة تفترض UTC. متى يعمل الاستخلاص؟</p><ul><li><b>أ.</b> قبل التحميل بساعة، فيقرأ بيانات الأمس</li><li><b>ب.</b> في الواحدة صباحًا بتوقيت الرياض، أثناء التحميل</li><li><b>ج.</b> كل ساعة، لأن الحقل الثاني رقم واحد</li><li><b>د.</b> في الرابعة صباحًا بتوقيت الرياض، بعد التحميل</li></ul></li>
<li><p>أطفأت القيم النموذجية في وصفة مجلد الشهادات، فظهر في الفحص أن عمود رقم الشهادة ما زال يعرض قيمًا في مدخل الكتالوج. ما الخطوة التالية؟</p><ul><li><b>أ.</b> تبحث عن إحصاء آخر يحمل القيم، مثل تكرار القيم، وتطفئه</li><li><b>ب.</b> تقبل الناتج لأن الإعداد المطلوب أُطفئ كما في الموافقة</li><li><b>ج.</b> تحذف العمود من الملف المصدر حتى لا يقرأه الموصل</li><li><b>د.</b> تخفض تصنيف العمود إلى «عام» حتى يجوز ظهوره</li></ul></li>
<li><p>يطلب منك مدير الاختبارات أن يُفهرس مجلد _incoming في مخزن ملفات الاختبارات «حتى نعرف ما رفعته المراكز». ما ردك المناسب؟</p><ul><li><b>أ.</b> تفهرسه كما طلب، فالمدير مالك المجال ويقرر ما يدخل</li><li><b>ب.</b> تفهرسه وتضع على مدخله وسم «غير مراجع»</li><li><b>ج.</b> لا تفهرسه، وتقترح قائمة بالمرفوعات من نظام الرفع</li><li><b>د.</b> تفهرسه في كتالوج ثانٍ منفصل لا يراه إلا المشرفون على البيانات</li></ul></li>
<li><p>قسم الاعتماد يعدّ «مزود تدريب معتمد» كل مزود له اعتماد ساري. قسم التقارير يعدّ كل مزود قدّم دورة هذا العام. قرر مدير الاعتماد تعريف قسمه. ماذا يُكتب في القاموس؟</p><ul><li><b>أ.</b> التعريفان معًا، ويختار كل قارئ ما يناسبه</li><li><b>ب.</b> تعريف قسم التقارير، لأن أرقامه هي المنشورة</li><li><b>ج.</b> تعريف قسم الاعتماد وحده، ويُحذف رقم التقارير</li><li><b>د.</b> تعريف قسم الاعتماد، واسم آخر لرقم التقارير، والقرار بتاريخه</li></ul></li>
<li><p>كتبت مشرفة الأعمال تعريف «ساعة تطوير مهني» وجعلت حالته «معتمد» وكتبت اسمها في خانة من اعتمد، لأن المالك في إجازة. ما المشكلة؟</p><ul><li><b>أ.</b> يبقى «قيد المراجعة» حتى يعتمده المالك</li><li><b>ب.</b> لا مشكلة، فالمشرفة أعرف الناس بالتعريف</li><li><b>ج.</b> المشكلة في الإصدار فقط: يجب أن يكون 0.9 حتى يعود المالك</li><li><b>د.</b> يكفي أن يوقّع المشرف الفني بدل المالك</li></ul></li>
<li><p>في جدولين عمود اسمه status: في جدول الاعتمادات حال الاعتماد (ساري، منتهٍ، موقوف)، وفي جدول الدورات حال الدورة (مسودة، منشورة، مغلقة). اقترحت الأداة ربطهما بمصطلح «حالة الاعتماد». ما قرارك؟</p><ul><li><b>أ.</b> تقبل الاقتراح، فالاسم واحد والأداة رأت الجدولين</li><li><b>ب.</b> ترفض الربط في الجدولين حتى يُغيّر الفريق الفني الأسماء</li><li><b>ج.</b> تقبله للأول فقط، وتربط عمود الدورات بمصطلح «حالة الدورة»</li><li><b>د.</b> تربط العمودين بمصطلح عام واحد اسمه «الحالة» يشمل المعنيين</li></ul></li>
<li><p>اعتُمد مصطلح «رقم الشهادة» مقيدًا، وربطته بعمودين: رقم الشهادة في جدول السجلات، وفي ملف رفع الشهادات. ما الذي يكسبه الكتالوج من هذا الربط تحديدًا؟</p><ul><li><b>أ.</b> يصبح العمودان عمودًا واحدًا في المصدر</li><li><b>ب.</b> يُقترح «مقيد» على العمودين، ويجدهما من يبحث بالمصطلح</li><li><b>ج.</b> يمنع الكتالوج أي شخص غير المالك من قراءة العمودين في المصدر</li><li><b>د.</b> يُحذف الوصف الآلي للعمودين ويحل محله التعريف</li></ul></li>
<li><p>مسودة لعمود hours في جدول الدورات: «عدد ساعات الدورة، وتُحتسب الساعة 45 دقيقة.» لا يذكر أي مصدر مدة الساعة. ما نوع الخطأ؟</p><ul><li><b>أ.</b> يكرر الاسم</li><li><b>ب.</b> وحدة أو صيغة خاطئة</li><li><b>ج.</b> معنى خاطئ</li><li><b>د.</b> قاعدة مختلقة</li></ul></li>
<li><p>راجعت مشرفة 50 مسودة: قبلت 20، وعدّلت 22، ورفضت 8. ما معدل الخطأ؟</p><ul><li><b>أ.</b> 60٪</li><li><b>ب.</b> 16٪</li><li><b>ج.</b> 44٪</li><li><b>د.</b> 40٪</li></ul></li>
<li><p>يريد فريق الكتالوج صياغة أوصاف أعمدة جدول سجلات التطوير المهني، وهو مصنف «مقيد»، بنموذج مستضاف معتمد. ماذا يُرسل إلى النموذج؟</p><ul><li><b>أ.</b> عشرة صفوف نموذجية مع الأسماء حتى يفهم النموذج المعنى</li><li><b>ب.</b> الأسماء والأنواع والقيم الدنيا والعليا من التنميط</li><li><b>ج.</b> الأسماء والأنواع فقط، بعد أن يقرر المالك أنها «عامة»</li><li><b>د.</b> لا شيء؛ أي استخدام للذكاء الاصطناعي ممنوع في الجهات الحكومية</li></ul></li>
<li><p>قُبلت مسودة وصف لجدول المزودين بعد مراجعة. ما الذي يبقى مع الوصف في الكتالوج؟</p><ul><li><b>أ.</b> لا شيء؛ بعد القبول يصبح وصفًا عاديًا</li><li><b>ب.</b> نص الطلب الذي أُرسل إلى النموذج</li><li><b>ج.</b> اسم النموذج وإصداره فقط</li><li><b>د.</b> أن الآلة صاغته، واسم من راجعه</li></ul></li>
</ol>

<section>
<h2>اليوم 2: المسار والقياس والنشر</h2>
<ol>
<li><p>في كتالوج جهة أخرى، ظهر في مدخل جدول المرشحين رقم جوال كامل في خانة القيم الشائعة. المشرف الفني حذف الرقم من المدخل يدويًا. ماذا سيحدث في الاستخلاص المجدول التالي؟</p><ul><li><b>أ.</b> يعود الرقم، فالوصفة هي التي تقرر ما يظهر</li><li><b>ب.</b> لا يعود، لأن الكتالوج يحفظ التعديل اليدوي</li><li><b>ج.</b> لا يعود إن صُنّف الجدول «مقيدًا» في الكتالوج</li><li><b>د.</b> يعود ما لم يُحذف الرقم من قاعدة البيانات نفسها</li></ul></li>
<li><p>في مجال الاختبارات، مهمة تبني «عدد الناجحين في كل جلسة» تصفّي الصفوف بشرط على عمود الدرجة، ولا تنسخه. الدرجة ستصبح من 1000. ماذا تكتب عنها في المذكرة؟</p><ul><li><b>أ.</b> تتعطل المهمة حين تتغير القيم، فيظهر الخلل في يومه ويُصلح</li><li><b>ب.</b> لا أثر، لأن عمود الدرجة لا يظهر في ناتجها</li><li><b>ج.</b> أثرها على فريق التطوير وحده، فهو من يغيّر</li><li><b>د.</b> يتغير رقمها بصمت: سيُعد الجميع ناجحين ما لم يُعدّل الشرط</li></ul></li>
<li><p>مصدر نتائج الاختبارات يُستخلص كل ليلة. في إعداد القياس حد الحداثة 30 فترة، والقياس يقول 100٪ حديث. في سجل التشغيل فشل في الليالي الخمس الأخيرة. ماذا تفعل؟</p><ul><li><b>أ.</b> تبقي الحد، لأن خمس ليال أقل بكثير من ثلاثين فترة</li><li><b>ب.</b> تقيس بالأيام بدل الفترات، فهي أوضح للمالك</li><li><b>ج.</b> تخفض الحد حتى يظهر الفشل، وتبلّغ المشرف الفني</li><li><b>د.</b> تحذف المدخل حتى ينجح الاستخلاص</li></ul></li>
<li><p>سجل «نسب الاجتياز الشهرية» اجتاز أداة التحقق. وصفه يقول «نسبة الناجحين» ولا يقول من أي عدد تُحسب، والمالك لم يقرأه بعد. ماذا تفعل؟</p><ul><li><b>أ.</b> تنشره، فاجتياز الأداة يعني أن السجل صحيح</li><li><b>ب.</b> تضيف تعريف القاموس، وتنتظر تأكيد المالك</li><li><b>ج.</b> تحذف الوصف حتى لا يُساء فهمه</li><li><b>د.</b> تنشره الآن، وتترك الأسئلة لجهة الاتصال تجيب عنها بعد النشر</li></ul></li>
<li><p>في سجل التشغيل، فشل استخلاص مخزن الملفات ثلاثة أسابيع متتالية، وما زالت مداخل الملفات في الكتالوج تعرض أعداد صفوف. كيف تقرأ تلك الأعداد؟</p><ul><li><b>أ.</b> أعداد اليوم، لأن الكتالوج يحسبها حين يُفتح المدخل</li><li><b>ب.</b> أعداد آخر استخلاص ناجح، أي قبل ثلاثة أسابيع</li><li><b>ج.</b> أعداد غير صالحة، لأن الفشل يمسح التنميط القديم</li><li><b>د.</b> أعداد تقديرية يملؤها الكتالوج حتى يعود الاستخلاص</li></ul></li>
<li><p>طلب تغيير على عمود exam_results.passed. أظهرت أداة الأثر أن ملف «أعداد الناجحين المنشورة بحسب المهنة» يعتمد عليه اعتمادًا غير مباشر من نوع تصفية، ولا ينسخ قيمته. ماذا يعني ذلك للملف؟</p><ul><li><b>أ.</b> يتغير عدد من يُحسب في الملف، ولو لم يتغير أي عمود فيه</li><li><b>ب.</b> لا أثر، لأن العمود لا يُنسخ إلى الملف</li><li><b>ج.</b> يتعطل الملف المنشور، لأن كل اعتماد غير مباشر يكسر التحميل</li><li><b>د.</b> يتغير عمود الاجتياز في الملف فقط</li></ul></li>
<li><p>أداة الأثر لم تُظهر أي مستهلك لعمود ساعات الدورة خارج المستودع. في ملاحظات قسم التقارير أن محللًا يستخرجه يدويًا كل شهر. ماذا تكتب في المذكرة؟</p><ul><li><b>أ.</b> لا أثر خارج المستودع، فالأحداث هي المرجع</li><li><b>ب.</b> يُلغى الاستخراج اليدوي لأنه لا يظهر في المسار</li><li><b>ج.</b> الاستخراج اليدوي متأثر، ومالكه يؤكد قبل التنفيذ</li><li><b>د.</b> يُطلب من المحلل أن يبث أحداثًا أولًا</li></ul></li>
<li><p>في مذكرة أثر: ثلاثة تقارير تتغير أرقامها، وملف بيانات مفتوحة منشور، ومهمة توقفت منذ ستة أشهر. فريق التطوير يريد التنفيذ بعد أسبوع. ما القرار الأنسب؟</p><ul><li><b>أ.</b> المضي، لأن فريق التطوير قدّر أن التغيير داخلي في النظام</li><li><b>ب.</b> التوقف الآن، والمضي حين تتحقق شروط لكل منها مالك</li><li><b>ج.</b> التوقف نهائيًا، لأن الأثر يصل إلى بيانات منشورة</li><li><b>د.</b> المضي، ثم إبلاغ الملاك بعد التنفيذ</li></ul></li>
<li><p>حدث تشغيل من خط المعالجة يذكر: المهمة، ومعرّف التشغيل، والمدخلات، والمخرجات، ووجه تتبع الأعمدة. أي سؤال لا يجيب عنه هذا الحدث وحده؟</p><ul><li><b>أ.</b> أي جداول قرأتها المهمة في هذا التشغيل؟</li><li><b>ب.</b> متى انتهى هذا التشغيل؟</li><li><b>ج.</b> أي عمود في المخرج حُسب من أي عمود في المدخل؟</li><li><b>د.</b> من يملك التقرير الذي يقرأ هذا المخرج؟</li></ul></li>
<li><p>رفضت أداة التحقق سجل «قائمة المزودين المعتمدين» برسالة: الترخيص يجب أن يكون من قائمة البوابة. في الخانة كُتب «مفتوح للجميع». ما الإصلاح؟</p><ul><li><b>أ.</b> إضافة جملة أطول تشرح أن البيانات مجانية</li><li><b>ب.</b> حذف الخانة، فالترخيص اختياري في البيانات المفتوحة</li><li><b>ج.</b> وضع رابط ترخيص من قائمة البوابة</li><li><b>د.</b> كتابة «CC BY» نصًا حرًا في حقل الوصف</li></ul></li>
<li><p>سجل لمجموعة «ساعات التطوير المهني المسجلة» فيه جهة الاتصال «مكتب البيانات المفتوحة» دون بريد. أداة التحقق ترفضه. لماذا تشترط البوابة البريد؟</p><ul><li><b>أ.</b> لأن البوابة ترسل كلمات المرور إلى ذلك البريد</li><li><b>ب.</b> لأن من يجد خطأ في البيانات يحتاج عنوانًا يصل إليه</li><li><b>ج.</b> لأن البريد يثبت أن الجهة حكومية</li><li><b>د.</b> لأن اسم المكتب قد يتغير، والبريد يبقى ثابتًا مع الوقت</li></ul></li>
<li><p>في سجل DCAT، الحقل dct:accrualPeriodicity قيمته «كل شهر تقريبًا». ما المشكلة؟</p><ul><li><b>أ.</b> يجب أن تكون قيمة من قائمة دوريات معيارية يفهمها النظام</li><li><b>ب.</b> لا مشكلة، فالمعنى مفهوم لأي قارئ</li><li><b>ج.</b> يجب أن تكون بالإنجليزية فقط</li><li><b>د.</b> يجب أن تكون تاريخ التحديث القادم</li></ul></li>
<li><p>يريد فريق خدمة العملاء مساعدًا يجيب «ما البيانات المتاحة عن المهن؟» من الكتالوج. ما الذي يصلح سياقًا له؟</p><ul><li><b>أ.</b> كل ما في الكتالوج، ومنه القيم النموذجية</li><li><b>ب.</b> سجلات المجموعات العامة وتعريفات القاموس المعتمدة</li><li><b>ج.</b> مداخل الجداول المقيدة دون أعمدتها الشخصية</li><li><b>د.</b> ملف الاستخلاص الخام كما كتبته الأداة</li></ul></li>
